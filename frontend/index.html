<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>News Credibility Checker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-5">

            <h1 class="text-center fw-bold">

                News Credibility Checker

            </h1>

            <p class="text-center text-muted mb-4">

                Analyze the credibility of news articles using trusted
                fact-checking sources and AI-powered claim verification.

            </p>

            <hr>

            <div class="mb-4">

                <label class="form-label fw-bold">

                    Choose Input Type

                </label>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="inputType"
                        id="textOption"
                        checked>

                    <label
                        class="form-check-label"
                        for="textOption">

                        Paste Article Text

                    </label>

                </div>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="inputType"
                        id="urlOption">

                    <label
                        class="form-check-label"
                        for="urlOption">

                        Enter Article URL

                    </label>

                </div>

            </div>

            <!-- Article Text Section -->

            <div id="textInputSection" class="mb-4">

                <label
                    for="articleText"
                    class="form-label fw-bold">

                    Article Text

                </label>

                <textarea
                    class="form-control"
                    id="articleText"
                    rows="8"
                    placeholder="Paste the full news article here..."></textarea>

            </div>

            <!-- URL Section (Hidden Initially) -->

            <div id="urlInputSection" class="mb-4 d-none">

                <label
                    for="articleUrl"
                    class="form-label fw-bold">

                    Article URL

                </label>

                <input
                    type="url"
                    class="form-control"
                    id="articleUrl"
                    placeholder="https://example.com/news-article">

            </div>

            <!-- Analyze Button -->

            <div class="d-grid">

                <button
                    type="button"
                    class="btn btn-primary btn-lg"
                    id="analyzeButton">

                    Analyze Article

                </button>

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
